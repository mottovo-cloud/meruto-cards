<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meruto Cards</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}.wrap{position:relative;padding:4px 0 10px}.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:2px 2px 6px;scrollbar-width:none}.track::-webkit-scrollbar{display:none}.card{position:relative;flex:0 0 auto;width:min(46vw,230px);aspect-ratio:3/4.15;border-radius:14px;overflow:hidden;scroll-snap-align:start;background:#dbeef6;box-shadow:0 1px 3px rgba(20,60,80,.12);text-decoration:none;display:block}.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}.card:hover img{transform:scale(1.04)}.meta{position:absolute;left:0;right:0;bottom:0;height:34%;padding:14px 16px;color:#fff;background:rgba(40,60,70,.42);backdrop-filter:blur(2px);display:flex;flex-direction:column;justify-content:space-between}.title{font-size:15px;font-weight:600;line-height:1.45;word-break:keep-all}.date{font-size:12px;opacity:.75;letter-spacing:.02em}.nav{position:absolute;top:calc(50% - 22px);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.15);color:#2a6f8f;font-size:16px;cursor:pointer}.prev{left:6px}.next{right:6px}.nav[disabled]{opacity:0;pointer-events:none}</style></head><body><div class="wrap"><div class="track" id="t"><a class="card" target="_top" href="https://www.notion.so/3fe389636309812385c6ffcb8d6a15fe"><img src="https://i.imgur.com/OXqOupm.png" alt=""><div class="meta"><div class="title">도시풍뎅이 × 바다풍뎅이</div><div class="date">1학년 · 07.10 – 07.20</div></div></a><a class="card" target="_top" href="https://www.notion.so/3fe389636309814c84c6d7919670600e"><img src="https://i.imgur.com/OXqOupm.png" alt=""><div class="meta"><div class="title">깃털 공작 두 마리</div><div class="date">2학년 · 07.24 – 07.31</div></div></a><a class="card" target="_top" href="https://www.notion.so/3fe389636309807fb318d095258f8324"><img src="https://i.imgur.com/OXqOupm.png" alt=""><div class="meta"><div class="title">울보와 비빌 언덕</div><div class="date">3학년 · 08.05 – 08.14</div></div></a></div><button class="nav prev" id="p">‹</button><button class="nav next" id="n">›</button></div><script>var t=document.getElementById('t'),p=document.getElementById('p'),n=document.getElementById('n');function s(){var c=t.querySelector('.card');return c?c.getBoundingClientRect().width+14:240}p.onclick=function(){t.scrollBy({left:-s()})};n.onclick=function(){t.scrollBy({left:s()})};function u(){p.disabled=t.scrollLeft<4;n.disabled=t.scrollLeft+t.clientWidth>=t.scrollWidth-4}t.addEventListener('scroll',u);window.addEventListener('resize',u);u();</script></body></html>
