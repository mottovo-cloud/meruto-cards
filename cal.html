<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"PF";src:url("pf700.woff2") format("woff2");font-weight:700}
@font-face{font-family:"CG";src:url("cg500.woff2") format("woff2");font-weight:500}
@font-face{font-family:"CG";src:url("cg500i.woff2") format("woff2");font-weight:500;font-style:italic}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;font-family:"CG",serif;font-variant-numeric:lining-nums}
.wrap{padding:10px;height:100%;display:flex;flex-direction:column;gap:10px}
.card{position:relative;flex:none;border-radius:22px;overflow:hidden;color:#fff;padding:18px 20px;display:flex;align-items:center;gap:18px;
 background:radial-gradient(120% 140% at 30% 40%,#6f9fde 0%,#5b8ad6 45%,#4f7fd0 70%,#87aee6 100%);box-shadow:0 8px 24px rgba(79,127,208,.25)}
.card:before{content:"";position:absolute;inset:0;opacity:.18;mix-blend-mode:soft-light;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.left{position:relative;text-align:left;min-width:28%}
.dow{font-family:"PF";font-size:clamp(16px,5vw,26px);letter-spacing:.06em}
.day{font-family:"PF";font-size:clamp(48px,17vw,92px);line-height:.95}
.mon{font-style:italic;font-size:clamp(12px,3.4vw,16px);opacity:.9;margin-top:4px}
.grid{position:relative;flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center;font-size:clamp(11px,3vw,15px)}
.grid .h{opacity:.75;font-size:.85em;padding-bottom:2px}
.grid .d{position:relative;height:1.75em;line-height:1.75em}
.grid .d.o{opacity:.35}
.grid .d.t{background:rgba(255,255,255,.28);border-radius:50%;width:1.75em;margin:0 auto;box-shadow:0 0 10px rgba(255,255,255,.4)}
.grid .d i{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);font-style:normal;font-size:.6em;line-height:1}
.sp{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
.list{flex:1;overflow:auto;padding:4px 6px}
.ev{display:flex;align-items:baseline;gap:10px;padding:7px 2px;border-bottom:1px dashed #d9e5f6;color:#37352f;font-size:clamp(13px,3.4vw,16px)}
.ev .dt{font-family:"PF";color:#4f7fd0;min-width:3.4em}
.ev .nm{flex:1}
.ev .dd{font-style:italic;color:#8aa6cf;font-size:.9em}
.cap{font-style:italic;color:#6f8fc4;text-align:center;font-size:clamp(12px,3.2vw,15px);padding-top:4px}
</style></head><body><div class="wrap">
<div class="card" id="card"><div class="left"><div class="dow" id="dow"></div><div class="day" id="day"></div><div class="mon" id="mon"></div></div><div class="grid" id="grid"></div></div>
<div class="list" id="list"></div>
</div><script>
// 일정: [날짜, 표시, 이름]
var EV=[];try{var q=new URLSearchParams(location.search).get('e');if(q)EV=q.split(';;').filter(Boolean).map(function(s){return s.split('|')})}catch(x){}
function kst(){return new Date(Date.now()+9*3600e3)}
function key(y,m,d){return y+'-'+(m<9?'0':'')+(m+1)+'-'+(d<10?'0':'')+d}
function render(){var k=kst(),y=k.getUTCFullYear(),m=k.getUTCMonth(),d=k.getUTCDate();
var D=['SUN','MON','TUE','WED','THU','FRI','SAT'],M=['January','February','March','April','May','June','July','August','September','October','November','December'];
dow.textContent=D[k.getUTCDay()];day.textContent=d;mon.textContent=M[m]+' '+y;
var g='';'SMTWTFS'.split('').forEach(function(c){g+='<div class="h">'+c+'</div>'});
var first=new Date(Date.UTC(y,m,1)).getUTCDay(),n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),pn=new Date(Date.UTC(y,m,0)).getUTCDate();
for(var i=0;i<first;i++)g+='<div class="d o">'+(pn-first+1+i)+'</div>';
var map={};EV.forEach(function(e){map[e[0]]=e[1]});
for(var i=1;i<=n;i++){var e=map[key(y,m,i)];g+='<div class="d'+(i==d?' t':'')+'">'+i+(e?'<i>'+e+'</i>':'')+'</div>'}
grid.innerHTML=g;
var today=Date.UTC(y,m,d),h='';EV.filter(function(e){return Date.parse(e[0])>=today}).sort().forEach(function(e){var t=Date.parse(e[0]),dd=Math.round((t-today)/864e5),p=e[0].split('-');
h+='<div class="ev"><span class="dt">'+(+p[1])+'.'+(+p[2])+'</span><span class="nm">'+e[1]+' '+e[2]+'</span><span class="dd">'+(dd==0?'today':'D-'+dd)+'</span></div>'});
list.innerHTML=h+'<div class="cap">see you soon, again and again.</div>'}
render();setInterval(render,60000);
var c=document.getElementById('card');for(var i=0;i<18;i++){var s=document.createElement('b');s.className='sp';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*4+'s';c.appendChild(s)}
</script></body></html>
