<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box}
html{font-size:clamp(14px,2.2vw,26px)}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#37352f}
.wrap{position:relative;height:100%;width:100%;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 100%)}
.log{position:absolute;left:.9rem;right:.9rem;bottom:.6rem;display:flex;flex-direction:column;gap:.7rem}
.row{display:flex;align-items:flex-end;gap:.6rem;opacity:0;transform:translateY(.9rem) scale(.96);transition:opacity .45s ease,transform .45s cubic-bezier(.2,.9,.25,1.2)}
.row.in{opacity:1;transform:none}
.row.r{flex-direction:row-reverse}
.av{width:2.9rem;height:2.9rem;border-radius:.85rem;flex:none;background-size:118%;background-position:center;box-shadow:0 0 0 1px rgba(55,53,47,.08)}
.col{display:flex;flex-direction:column;max-width:72%}
.row.r .col{align-items:flex-end}
.nm{font-size:.72rem;color:#9b9a97;margin:0 .3rem .2rem}
.bb{padding:.55rem .9rem;border-radius:1rem;font-size:1rem;line-height:1.5;word-break:keep-all;background:#f1f1ef}
.row:not(.r) .bb{border-bottom-left-radius:.3rem}
.row.r .bb{background:#e7f3f8;color:#28456c;border-bottom-right-radius:.3rem}
.typing .bb{display:flex;gap:.3rem;padding:.8rem .9rem}
.typing i{width:.4rem;height:.4rem;border-radius:50%;background:#b9b8b4;animation:t 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes t{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-.2rem);opacity:1}}
.cont .av{visibility:hidden}.cont .nm{display:none}
.tinted .row:not(.r) .bb{background:#fff}.tinted .row.r .bb{background:#f6e3a6;color:#5c4813}.tinted .typing i{background:#d1b665}
</style></head><body><div class="wrap"><div class="log" id="log"></div></div>

r.innerHTML='<div class="av" style="background-image:url('+p.img+')"></div><div class="col"><div class="nm">'+p.name+'</div><div class="bb">'+html+'</div></div>';log.appendChild(r);requestAnimationFrame(function(){requestAnimationFrame(function(){r.classList.add('in')})});return r}
