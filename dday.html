<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"PF";src:url("pf700.woff2") format("woff2");font-weight:700}
@font-face{font-family:"CG";src:url("cg500.woff2") format("woff2");font-weight:500}
@font-face{font-family:"CG";src:url("cg500i.woff2") format("woff2");font-weight:500;font-style:italic}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
.st{position:relative;width:100%;height:100%;min-height:220px;display:flex;align-items:center;justify-content:center}
.orb{position:absolute;inset:0;background:url("orb_t.png") center/contain no-repeat;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.veil{position:absolute;left:50%;top:50%;width:min(78vw,78vh);height:min(78vw,78vh);transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,.30) 0%,rgba(255,255,255,.16) 45%,rgba(255,255,255,0) 70%);
 -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
 -webkit-mask-image:radial-gradient(circle,#000 35%,transparent 70%);mask-image:radial-gradient(circle,#000 35%,transparent 70%)}
.grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:soft-light;pointer-events:none;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
 -webkit-mask-image:radial-gradient(circle,#000 30%,transparent 62%);mask-image:radial-gradient(circle,#000 30%,transparent 62%)}
.txt{position:relative;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;text-align:center;color:#fff;text-shadow:0 1px 14px rgba(35,90,160,.35)}
.top{font-family:"CG",serif;font-size:min(5vw,5vh);letter-spacing:.08em;opacity:.95}
.big{font-family:"PF",serif;font-weight:700;font-size:min(19vw,19vh);line-height:1;margin:.04em 0 .02em;letter-spacing:-.01em}
.big small{font-size:1em;margin-right:.02em}
.sub{font-family:"CG",serif;font-style:italic;font-size:min(4.4vw,4.4vh);opacity:.92;letter-spacing:.02em}
.sp{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;opacity:0;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.9;transform:scale(1)}}
</style></head><body><div class="st" id="st">
<div class="orb"></div><div class="veil"></div><div class="grain"></div>
<div class="txt"><div class="top" id="top"></div><div class="big"><small>D+</small><span id="n">1</span></div><div class="sub">and every day since, a little more of you.</div></div>
</div><script>
var START=Date.UTC(2026,9,30); // day 1 (KST)
function upd(){var k=new Date(Date.now()+9*3600e3);var today=Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate());
var n=Math.floor((today-START)/864e5)+1;document.getElementById('n').textContent=n;
var D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
document.getElementById('top').textContent=D[k.getUTCDay()]+' '+k.getUTCDate()+' · '+M[k.getUTCMonth()]}
upd();setInterval(upd,60000);
var st=document.getElementById('st');for(var i=0;i<14;i++){var s=document.createElement('i');s.className='sp';var a=Math.random()*6.283,r=18+Math.random()*24;
s.style.left=(50+Math.cos(a)*r)+'%';s.style.top=(50+Math.sin(a)*r)+'%';s.style.animationDelay=(Math.random()*4)+'s';s.style.animationDuration=(3+Math.random()*3)+'s';st.insertBefore(s,st.querySelector('.txt'))}
</script></body></html>
