<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>@font-face{font-family:"Fifties";src:url("Fifties_Movies.ttf") format("truetype");font-display:swap}*{box-sizing:border-box}:root{--mono:"Fifties","Pretendard",sans-serif}html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#37352f;cursor:pointer;user-select:none}.st{position:relative;width:100%;height:100%;min-height:240px}svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}.arc{fill:none;stroke:#e3e2e0;stroke-width:1}.lb{position:absolute;left:0;top:0;color:transparent;-webkit-background-clip:text;background-clip:text;padding:.08em 0;font-family:var(--mono);font-weight:400;line-height:1;white-space:nowrap;letter-spacing:0;transform-origin:0 50%;will-change:transform}.cap{position:absolute;left:var(--mx);top:calc(50% + var(--bs) * .62);right:8px;transition:opacity .35s}.ttl{font-family:var(--mono);font-size:13px;color:transparent;background:linear-gradient(180deg,#5fd3c6,#337ea9 85%);-webkit-background-clip:text;background-clip:text;display:inline-block;letter-spacing:.04em}.ft{position:absolute;left:var(--mx);bottom:10px;right:8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#9b9a97}.ft b{font-weight:400;color:#37352f}.sub{margin-top:2px;font-size:10px;line-height:1.45;color:#787774}</style></head><body><div class="st" id="st"><svg id="sv"></svg><div class="ft">LAST UPDATE<br><b>2026.10.21 WED 14:15</b></div><div class="cap" id="cap"><div class="ttl" id="ttl"></div><div class="sub" id="sub"></div></div></div><script>
var items=[["105","STORIES","주고받은 썰"],["8,270","CHATS","주고받은 메시지"],["52%","오리지널","썰 55개"],["24%","성인·19","썰 25개"],["13%","AU","썰 14개"],["10%","CP·맞짝","썰 11개"]];
var N=items.length,cur=0,pos=0,st=document.getElementById('st'),sv=document.getElementById('sv'),NS='http://www.w3.org/2000/svg',labs=[],ticks=[],g={};
function lerp(a,b,t){return a+(b-a)*t}
function mix(c1,c2,t){var a=c1.match(/\w\w/g).map(function(h){return parseInt(h,16)}),b=c2.match(/\w\w/g).map(function(h){return parseInt(h,16)});return 'rgb('+a.map(function(v,i){return Math.round(lerp(v,b[i],t))}).join(',')+')'}
function build(){var W=st.clientWidth,H=st.clientHeight,R=H*0.62,edge=Math.min(W*0.16,60);g={W:W,H:H,R:R,cx:edge-R,cy:H/2,step:0.34,off:Math.max(10,W*0.04),mx:edge+Math.max(14,W*0.06),small:Math.max(11,Math.min(W*0.045,16)),big:Math.max(26,Math.min(W*0.14,50))};
st.style.setProperty('--mx',g.mx+'px');st.style.setProperty('--bs',g.big+'px');sv.innerHTML='';var a=document.createElementNS(NS,'circle');a.setAttribute('cx',g.cx);a.setAttribute('cy',g.cy);a.setAttribute('r',R);a.setAttribute('class','arc');sv.appendChild(a);
labs.forEach(function(l){l.remove()});labs=[];ticks=[];for(var i=0;i<N;i++){var t=document.createElementNS(NS,'circle');sv.appendChild(t);ticks.push(t);var l=document.createElement('div');l.className='lb';l.textContent=items[i][0];st.appendChild(l);labs.push(l)}place()}
function place(){for(var i=0;i<N;i++){var rel=((i-pos)%N+N+N/2)%N-N/2,ang=rel*g.step,near=Math.max(0,1-Math.abs(rel));near=near*near*(3-2*near);
var tx=g.cx+g.R*Math.cos(ang),ty=g.cy+g.R*Math.sin(ang);ticks[i].setAttribute('cx',tx);ticks[i].setAttribute('cy',ty);ticks[i].setAttribute('r',lerp(2,3,near));ticks[i].style.fill=mix('d3d1cb','337ea9',near);ticks[i].style.opacity=Math.abs(ang)<1.4?1:0;
var ax=g.cx+(g.R+g.off)*Math.cos(ang),ay=g.cy+(g.R+g.off)*Math.sin(ang);var x=lerp(ax,g.mx,near),y=lerp(ay,g.cy,near),fs=lerp(g.small,g.big,near),rot=ang*180/Math.PI*(1-near);var l=labs[i];l.style.fontSize=fs+'px';l.style.backgroundImage='linear-gradient(180deg,'+mix('c7c6c2','5fd3c6',near)+' 0%,'+mix('c7c6c2','337ea9',near)+' 85%)';l.style.transform='translate('+x+'px,'+(y-fs/2)+'px) rotate('+rot+'deg)';l.style.opacity=Math.abs(ang)<1.4?Math.max(.15,1-Math.abs(ang)/1.6):0}}
function cap(){var it=items[cur];document.getElementById('ttl').textContent=it[1];document.getElementById('sub').textContent=it[2]}
function animTo(target){var from=pos,t0=null,c=document.getElementById('cap');c.style.opacity=0;function f(t){t0=t0||t;var p=Math.min((t-t0)/1100,1),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;pos=from+(target-from)*e;place();if(p<1)requestAnimationFrame(f);else{cap();c.style.opacity=1}}requestAnimationFrame(f)}
function next(){cur=(cur+1)%N;animTo(pos+1)}
var timer=setInterval(next,3000);st.addEventListener('click',function(){clearInterval(timer);next();timer=setInterval(next,3000)});window.addEventListener('resize',build);build();cap();
</script></body></html>
